version: '3.8'

services:
  inventory_mysql:
    image: mysql:8.0
    container_name: inventory_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend-app:
    build: .
    image: backend-app:latest
    container_name: backend_prod
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: inventory_mysql
      MYSQL_PASSWORD: root
      MYSQL_PORT: 3306
    depends_on:
      inventory_mysql:
        condition: service_healthy
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  mysql_data: