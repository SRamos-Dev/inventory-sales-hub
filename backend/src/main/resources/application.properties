spring.application.name=inventorysaleshub

# --- BASE DE DATOS (MySQL) ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/inventory_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# --- JPA / HIBERNATE (Ajustado para Spring Boot 3) ---
# En Spring Boot 3, no suele ser necesario especificar el dialecto manualmente,
# pero si lo haces, usa el genérico o deja que Spring lo detecte.
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect <--- BORRAR o COMENTAR (Obsoleto en Hibernate 6)

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- SEGURIDAD JWT (Vital para tu JwtProvider) ---
# Expiración en segundos (86400 = 1 día)
jwt.expiration=86400

# CLAVE SECRETA (HS256)
# Debe tener al menos 32 caracteres (256 bits) para evitar WeakKeyException
# He generado esta cadena aleatoria segura para ti. Úsala para el laboratorio.
jwt.secret=9a2f8c4e6b0d71f3g5h8j2k4l6n8p0q2r4t6v8x0z1234567890SecretKeyGeneratedByNexus
